name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: python cli.py evaluate

  sweep:
    # Shared runners cannot produce quotable timings, so this job checks the
    # part of the sweep that is machine-independent: the accuracy ordering.
    # Quotable numbers live in results/, each stamped with its machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Sweep
        run: python cli.py sweep --out results/ci | tee sweep-ci.txt
      - name: Assert 8-path still beats every 5-path setting
        run: |
          python - <<'PY'
          # stdlib csv on purpose: this check must not add a dependency the
          # project does not otherwise need.
          import csv, sys

          five, eight = [], []
          with open("results/ci/sweep.csv") as fh:
              for row in csv.DictReader(fh):
                  mae = float(row["mae"])
                  (eight if row["param_mode_hh"] == "True" else five).append(mae)

          if not five or not eight:
              sys.exit(f"sweep produced {len(five)} 5-path and {len(eight)} 8-path rows")

          best_five, best_eight = min(five), min(eight)
          print(f"best 5-path MAE {best_five:.4f} over {len(five)} settings")
          print(f"best 8-path MAE {best_eight:.4f} over {len(eight)} settings")
          if best_eight >= best_five:
              sys.exit(f"regression: 8-path {best_eight:.4f} no longer beats 5-path {best_five:.4f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-ci-${{ github.sha }}
          path: sweep-ci.txt
